<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ricardo Motta Webpage - Research</title>
  <meta property="og:title" content="Ricardo Motta Webpage - Research">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>

<body>

  <!-- Top bar: site title, menu (it turns into a drawer on phones) and the light/dark mode button -->
  <header class="topbar">
    <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 7h18M3 12h18M3 17h18" stroke="currentColor" stroke-width="2" fill="none" />
      </svg>
    </button>
    <a class="site-title" href="./">Ricardo Motta Webpage</a>
    <nav class="menu" id="menu" aria-label="Main menu">
      <ul>
        <li><a href="./">Home</a></li>
        <li><a href="research" aria-current="page">Research</a></li>
        <li><a href="talks-and-events">Talks and events</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch between light and dark mode" title="Switch between light and dark mode">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" fill="none" />
      </svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <div class="backdrop"></div>
  </header>

  <main>

    <!-- Banner -->
    <section class="banner">
      <div class="container">
        <div class="row">
          <div class="col col-12">
            <div class="box">
              <h1 class="banner-title">Research</h1>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Papers: one <li> per paper; the title links to the paper's page on this site, when it has one -->
    <section class="section">
      <div class="container">
        <div class="row">
          <div class="col col-12">
            <div class="box">
              <h2>Submitted</h2>
              <ul class="events papers">
                <li><a href="papers/fractional-laplacian-uniqueness/">Uniqueness and non-uniqueness pairs for the
                    fractional Laplacian</a>. Preprint at <a href="https://arxiv.org/abs/2604.12997" target="_blank"
                    rel="noopener">arXiv</a>. 41 pages.</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

</body>

</html>
